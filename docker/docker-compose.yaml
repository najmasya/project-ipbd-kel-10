x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-ipbd_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipbd_pass}
  POSTGRES_DB: ${POSTGRES_DB:-pipeline_db}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_pass123}

networks:
  ipbd-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  zk-data:
  spark-data:
  airflow-logs:

services:

  # ==========================================
  # PostgreSQL — Gold Layer + Metadata
  # ==========================================
  postgres:
    image: postgres:15
    container_name: ipbd-postgres
    environment:
      <<: *common-env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/gold_layer.sql:/docker-entrypoint-initdb.d/01_gold_layer.sql
    networks:
      - ipbd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MinIO — Bronze / Silver Layer (S3-compatible)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: ipbd-minio
    environment:
      <<: *common-env
      MINIO_DOMAIN: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - ipbd-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Zookeeper — Kafka dependency
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: ipbd-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
    networks:
      - ipbd-net

  # ==========================================
  # Kafka — Message Broker
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ipbd-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ipbd-net

  # ==========================================
  # Spark — Master
  # ==========================================
  spark-master:
    image: ipbd-spark:custom
    container_name: ipbd-spark-master
    user: root
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    entrypoint: []
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8090:8080"
      - "7077:7077"
    volumes:
      - ../src:/opt/spark-apps
      - ../config/spark.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - ipbd-net

  # ==========================================
  # Spark — Worker
  # ==========================================
  spark-worker:
    image: ipbd-spark:custom
    container_name: ipbd-spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    entrypoint: []
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8091:8081"
    volumes:
      - ../src:/opt/spark-apps
      - ../config/spark.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - ipbd-net

  # ==========================================
  # Airflow — Init (create DB + user)
  # ==========================================
  airflow-init:
    build:
      context: ../docker/airflow
    image: ipbd-airflow:custom
    container_name: ipbd-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-ipbd_user}:${POSTGRES_PASSWORD:-ipbd_pass}@postgres:5432/${POSTGRES_DB:-pipeline_db}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-LpPgWd7oJ2G5GclCHpQhN9_rUwiK36Jg-nZQFmvAWzM=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../scripts:/opt/airflow/scripts
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ipbd-net

  # ==========================================
  # Airflow — Webserver
  # ==========================================
  airflow-webserver:
    image: ipbd-airflow:custom
    container_name: ipbd-airflow-webserver
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-ipbd_user}:${POSTGRES_PASSWORD:-ipbd_pass}@postgres:5432/${POSTGRES_DB:-pipeline_db}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-LpPgWd7oJ2G5GclCHpQhN9_rUwiK36Jg-nZQFmvAWzM=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/src:/opt/airflow/dags:/opt/airflow/scripts
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-ipbd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipbd_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_db}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_pass123}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
    command: airflow webserver
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../scripts:/opt/airflow/scripts
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ipbd-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================
  # Airflow — Scheduler
  # ==========================================
  airflow-scheduler:
    image: ipbd-airflow:custom
    container_name: ipbd-airflow-scheduler
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-ipbd_user}:${POSTGRES_PASSWORD:-ipbd_pass}@postgres:5432/${POSTGRES_DB:-pipeline_db}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-LpPgWd7oJ2G5GclCHpQhN9_rUwiK36Jg-nZQFmvAWzM=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/src:/opt/airflow/dags:/opt/airflow/scripts
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-ipbd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipbd_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_db}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_pass123}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
    command: airflow scheduler
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../scripts:/opt/airflow/scripts
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ipbd-net

  # ==========================================
  # MLflow — Experiment Tracking & Model Registry
  # ==========================================
  mlflow:
    build:
      context: ../docker/mlflow
    container_name: ipbd-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-ipbd_user}:${POSTGRES_PASSWORD:-ipbd_pass}@postgres:5432/${POSTGRES_DB:-pipeline_db}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_pass123}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
    command: ["server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "postgresql://${POSTGRES_USER:-ipbd_user}:${POSTGRES_PASSWORD:-ipbd_pass}@postgres:5432/${POSTGRES_DB:-pipeline_db}", "--default-artifact-root", "s3://mlflow-artifacts/", "--artifacts-destination", "s3://mlflow-artifacts/"]
    ports:
      - "5000:5000"
    networks:
      - ipbd-net

  # ==========================================
  # Trino — Federated SQL Query Engine
  # ==========================================
  trino:
    image: trinodb/trino:434
    container_name: ipbd-trino
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      - ../docker/trino/etc/catalog:/etc/trino/catalog
    networks:
      - ipbd-net

  # ==========================================
  # Streamlit — Dashboard
  # ==========================================
  streamlit:
    build:
      context: ./streamlit
    container_name: ipbd-streamlit
    depends_on:
      - trino
    environment:
      TRINO_HOST: ${TRINO_HOST:-trino}
      TRINO_PORT: ${TRINO_PORT:-8082}
      STREAMLIT_AUTH_USERNAME: ${STREAMLIT_AUTH_USERNAME:-admin}
      STREAMLIT_AUTH_PASSWORD: ${STREAMLIT_AUTH_PASSWORD:-admin123}
    ports:
      - "8501:8501"
    volumes:
      - ../src/dashboard:/app
    networks:
      - ipbd-net

  # ==========================================
  # Grafana — Monitoring & Alerting
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ipbd-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS:
    ports:
      - "3001:3000"
    volumes:
      - ../docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../docker/grafana/notifiers:/etc/grafana/provisioning/notifiers
      - ../docker/grafana/alerts:/etc/grafana/provisioning/alerting
    networks:
      - ipbd-net

  # ==========================================
  # Health Checker — Monitoring semua service + resource
  # ==========================================
  health-checker:
    build:
      context: ../docker/health-checker
    container_name: ipbd-health-checker
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ipbd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipbd_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_db}
      HEALTH_CHECK_INTERVAL: "60"
      RESOURCE_POLL_INTERVAL: "30"
    volumes:
      - ../scripts/resource_monitor.py:/app/resource_monitor.py
      - ../docker/health-checker/health_check.py:/app/health_check.py
      - ../scripts/pipeline_logger.py:/app/pipeline_logger.py
    networks:
      - ipbd-net
