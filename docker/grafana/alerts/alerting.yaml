apiVersion: 1

contactPoints:
  - orgId: 1
    name: TelegramAlerts
    receivers:
      - uid: telegram1
        type: telegram
        settings:
          bottoken: "your_telegram_bot_token"
          chatid: "your_telegram_chat_id"
          parse_mode: "HTML"

policies:
  - orgId: 1
    receiver: TelegramAlerts
    group_by: ['alertname']

groups:
  - orgId: 1
    name: IPBD_Alerts
    folder: Monitoring
    interval: 1m
    rules:
      - uid: cpu_alert
        title: CPU Usage > 90%
        condition: B
        data:
          - refId: A
            datasourceUid: PCC52D03280B7034C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              rawSql: "SELECT cpu_percent FROM resource_metrics ORDER BY recorded_at DESC LIMIT 1"
              format: table
          - refId: B
            datasourceUid: "__expr__"
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "CPU Usage is very high"

      - uid: mem_alert
        title: Memory Usage > 90%
        condition: B
        data:
          - refId: A
            datasourceUid: PCC52D03280B7034C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              rawSql: "SELECT memory_percent FROM resource_metrics ORDER BY recorded_at DESC LIMIT 1"
              format: table
          - refId: B
            datasourceUid: "__expr__"
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Memory Usage is very high"

      - uid: disk_alert
        title: Disk Usage > 90%
        condition: B
        data:
          - refId: A
            datasourceUid: PCC52D03280B7034C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              rawSql: "SELECT disk_percent FROM resource_metrics ORDER BY recorded_at DESC LIMIT 1"
              format: table
          - refId: B
            datasourceUid: "__expr__"
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Disk Usage is very high"

      - uid: pipeline_alert
        title: Airflow Pipeline Failed
        condition: B
        data:
          - refId: A
            datasourceUid: PCC52D03280B7034C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            model:
              rawSql: "SELECT COUNT(*) FROM pipeline_logs WHERE status = 'failed' AND started_at > NOW() - INTERVAL '5 minutes'"
              format: table
          - refId: B
            datasourceUid: "__expr__"
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Airflow Pipeline Execution Failed!"
